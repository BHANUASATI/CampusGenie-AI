[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'PYTHONPATH=src python3 scripts/init_db.py && cd src && python3 -m uvicorn main:app --host 0.0.0.0 --port ${PORT:-8002}'"
healthcheckPath = "/api/ai/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
